name: release

# Runs only when a version tag (v1.2.3) is pushed. Publishes GitHub Release
# assets only: 5 archives, an SPDX SBOM per archive and checksums.txt, then
# records keyless build provenance attestations for the archives and
# checksums.txt (GitHub OIDC; no signing keys or secrets). Binaries are not
# code-signed in v0.1.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # OIDC token for keyless provenance attestations
      attestations: write # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install syft (pinned version and SHA-256)
        env:
          SYFT_VERSION: 1.57.1
          # From syft_1.57.1_checksums.txt on the official v1.57.1 release.
          SYFT_SHA256: bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c
        run: |
          set -eu
          tarball="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/$tarball"
          echo "$SYFT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/syft"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/syft" syft
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/syft/syft" version
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
